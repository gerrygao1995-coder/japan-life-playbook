name: Import prepared guide
on:
  workflow_dispatch:
  push:
    paths:
      - 'kurashi-no-handancho-github.zip'
permissions:
  contents: write
concurrency:
  group: import-guide
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Expand the reviewed source archive
        run: |
          unzip -q kurashi-no-handancho-github.zip -d "$RUNNER_TEMP/guide-import"
          rsync -a --exclude='.github/workflows/' "$RUNNER_TEMP/guide-import/kurashi-no-handancho/" ./
      - name: Build and validate all guide files
        run: |
          npm run build
          npm run check
      - name: Commit the full guide directory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A book content docs dist scripts .github/ISSUE_TEMPLATE .gitignore README.md GUIDE.md CONTRIBUTING.md CHANGELOG.md LICENSE-CODE LICENSE-CONTENT package.json index.template.html style.css app.js enhancements.js site.config.json
          if ! git diff --cached --quiet; then
            git commit -m "日本語ガイド第2版の本文・電子書籍・ウェブ版を更新"
            git push origin HEAD:main
          fi
